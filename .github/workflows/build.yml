name: Build Yoga Launcher APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      # When the build fails, put the real reason in the Annotations list and the run summary
      - name: Show the real error
        if: failure()
        run: |
          grep -E '^e: ' build.log | head -20 | sed -E 's#^e: (file://)?#::error::#' || true
          grep -E 'What went wrong' -A6 build.log | head -20 | sed -E 's#^#::error::#' || true
          {
            echo '### Build failed'
            echo '```'
            grep -E '^e: |What went wrong|error:|Execution failed' -A4 build.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yoga-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
