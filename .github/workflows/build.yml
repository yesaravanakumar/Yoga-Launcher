name: Build Yoga Launcher APK

on:
  push:
    branches: [main]
    tags: ['v*']          # pushing a tag like v1.62.3 builds the signed release and publishes a GitHub Release
  workflow_dispatch:

permissions:
  contents: write         # needed to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Fail on leftover merge-conflict markers
        run: |
          if grep -rnIE '^(<<<<<<< |=======$|>>>>>>> )' app .github --include=*.kt --include=*.kts --include=*.xml --include=*.html --include=*.yml; then
            echo "::error::Merge-conflict markers found - resolve them before building"; exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build index.html from app/src/web
        run: node tools/build-web.js

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      # ---- Release (signed APK + Play bundle). Needs 4 repository secrets, see docs/PLAY_RELEASE.md ----
      - name: Check release signing secrets
        id: sign
        env:
          KS: ${{ secrets.YOGA_KEYSTORE_BASE64 }}
          KP: ${{ secrets.YOGA_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.YOGA_KEY_ALIAS }}
        run: |
          if [ -n "$KS" ] && [ -n "$KP" ] && [ -n "$KA" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ -z "$KS" ]; then echo "::error::Tag build needs the signing secrets (YOGA_KEYSTORE_BASE64, YOGA_KEYSTORE_PASSWORD, YOGA_KEY_ALIAS)"; exit 1; fi

      - name: Minify web bundle for release
        if: steps.sign.outputs.ok == 'true'
        run: |
          (cd tools && npm ci --no-audit --no-fund)
          (cd tools/smoke && npm ci --no-audit --no-fund)
          MINIFY=1 node tools/build-web.js
          # the minified page must still load without script errors, and the pill colour option must still work
          node tools/smoke/smoke-load.js | tee smoke.log
          grep -q '^errors: 0' smoke.log || { echo "::error::Minified page logs script errors"; exit 1; }
          node tools/smoke/pillcolor-test.js
          node tools/smoke/capsulecolor-test.js

      - name: Build signed release APK and AAB
        if: steps.sign.outputs.ok == 'true'
        env:
          YOGA_KEYSTORE_PASSWORD: ${{ secrets.YOGA_KEYSTORE_PASSWORD }}
          YOGA_KEY_ALIAS: ${{ secrets.YOGA_KEY_ALIAS }}
          YOGA_KEY_PASSWORD: ${{ secrets.YOGA_KEY_PASSWORD }}
          KS_B64: ${{ secrets.YOGA_KEYSTORE_BASE64 }}
        run: |
          set -o pipefail
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export YOGA_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease bundleRelease --stacktrace --console=plain 2>&1 | tee -a build.log
          rm -f "$RUNNER_TEMP/release.jks"
          cp app/build/outputs/apk/release/app-release.apk "yoga-launcher-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "yoga-launcher-${GITHUB_REF_NAME}.aab"

      - name: Upload release files
        if: steps.sign.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yoga-launcher-release
          path: |
            yoga-launcher-*.apk
            yoga-launcher-*.aab

      - name: Publish GitHub Release
        if: steps.sign.outputs.ok == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" yoga-launcher-*.apk yoga-launcher-*.aab \
            --title "Yoga Launcher $GITHUB_REF_NAME" --generate-notes

      # When the build fails, put the real reason in the Annotations list and the run summary
      - name: Show the real error
        if: failure()
        run: |
          grep -E '^e: ' build.log | head -20 | sed -E 's#^e: (file://)?#::error::#' || true
          grep -E 'What went wrong' -A6 build.log | head -20 | sed -E 's#^#::error::#' || true
          {
            echo '### Build failed'
            echo '```'
            grep -E '^e: |What went wrong|error:|Execution failed' -A4 build.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yoga-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
