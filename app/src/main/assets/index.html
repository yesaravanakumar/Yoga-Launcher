<html lang="en"><head><meta charset="utf-8">

<style>
@property --rose{syntax:'<color>';inherits:true;initial-value:#e8c6c0}
:root{--bg:#07080a;--screen:#0b0c0f;--ink:#f1ece9;--dim:#7d7a80;--line:#2a2a30;--display:'Chakra Petch',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);--inout:cubic-bezier(.65,0,.35,1);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{background:var(--bg);color:var(--ink);font-family:var(--display);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:12px 16px;user-select:none;-webkit-user-select:none}

.un #top{opacity:0;transform:translateY(-3cqh) scale(.9);pointer-events:none}

.wedge{fill:var(--rose);fill-opacity:.1;transition:fill-opacity .2s}.wedge.sel{fill-opacity:.6}
.init{fill:var(--ink);font:700 14px var(--display);text-anchor:middle;dominant-baseline:central;pointer-events:none}

.sel-label{position:absolute;left:0;right:0;top:77cqh;text-align:center;font:500 max(11px,3.2cqw)/1.5 var(--mono);letter-spacing:.2em;color:var(--rose);text-transform:uppercase}

#photoBtn{left:7cqw}#sleepBtn{right:7cqw}
button:focus-visible{outline:2px solid var(--rose);outline-offset:3px}

.app-ico{width:22cqw;height:22cqw;margin:6cqh 0 3cqh;border-radius:50%;background:color-mix(in srgb,var(--rose) 16%,transparent);display:grid;place-items:center}
.app-ico svg{width:50%;height:50%}
#app h2{margin:0;font:italic 700 12cqw/1 var(--display)}
#app p{margin:2cqh 0 0;font:400 max(12px,3.4cqw)/1.6 var(--mono);color:var(--dim);max-width:34ch}
.toast{position:absolute;left:50%;bottom:21cqh;transform:translate(-50%,10px);background:#1c1b21;border:1px solid var(--line);color:var(--ink);padding:1.4cqh 4cqw;border-radius:99px;font:500 max(10px,2.9cqw)/1 var(--mono);opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
.pulse{animation:pls 3.2s ease-in-out infinite;filter:drop-shadow(0 0 4px var(--rose))}@keyframes pls{50%{opacity:.62}}
.nop .pulse{animation:none;filter:none}
.sheet{position:absolute;inset:0;z-index:8}.sheet[hidden]{display:none}
.shbg{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .35s}
.shp{position:absolute;left:0;right:0;bottom:0;max-height:70cqh;overflow:auto;background:#121317;border-top:1px solid var(--line);border-radius:6cqw 6cqw 0 0;padding:2.5cqh 7cqw 5cqh;transform:translateY(100%);transition:transform .5s cubic-bezier(.34,1.3,.5,1)}
.sheet.in .shbg{opacity:1}.sheet.in .shp{transform:none}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5cqh}
.shh b{font:italic 700 6cqw/1 var(--display)}

.row{display:flex;align-items:center;gap:3.5cqw;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:1.6cqh 0;font:500 max(13px,3.6cqw)/1 var(--display);text-align:left;cursor:pointer}
.av{width:9cqw;height:9cqw;border-radius:50%;background:color-mix(in srgb,var(--rose) 16%,transparent);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.fi{width:100%;background:#0b0c0f;border:1px solid var(--line);border-radius:3cqw;color:var(--ink);padding:1.6cqh 3cqw;margin-bottom:1.2cqh;font:400 max(16px,3.8cqw)/1.2 var(--mono);user-select:text;-webkit-user-select:text}

.chips{margin-top:2cqh;display:flex;justify-content:center;gap:2cqw}

.chip i{width:1.3cqw;height:1.3cqw;border-radius:50%;background:var(--rose)}
.dots{fill:none;stroke:var(--rose);stroke-opacity:.28;stroke-dasharray:1.5 7;stroke-linecap:round;transform-origin:center;transform-box:fill-box;animation:spn 90s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
.clock i{animation:bl 2s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
.sec{width:30cqw;height:1px;background:var(--line);margin:1.2cqh auto 0}.sec u{display:block;height:100%;background:var(--rose);width:0;transition:width 1s linear}
/* ---- motion system ---- */
.aura{position:absolute;inset:-20%;pointer-events:none;z-index:0;transform:translate(calc(var(--px,0)*3cqw),calc(var(--py,0)*3cqw));transition:transform 1.4s var(--ease)}
.aura i{position:absolute;width:70cqw;height:70cqw;border-radius:50%;background:var(--rose);filter:blur(10cqw);opacity:.2;animation:drift 18s ease-in-out infinite alternate}

@keyframes drift{to{transform:translate(14cqw,-10cqw) scale(1.3)}}
@keyframes riseIn{from{opacity:0;transform:translateY(3cqh);filter:blur(8px)}}
#top>*{animation:riseIn 1s var(--ease) calc(var(--i,0)*85ms + 220ms) backwards}
#top>:nth-child(2){--i:1}#top>:nth-child(3){--i:2}#top>:nth-child(4){--i:3}#top>:nth-child(5){--i:4}

@keyframes shim{to{background-position:-100% 0}}
.sec u{box-shadow:0 0 6px var(--rose)}
.chip i{animation:dotp 2.6s ease-in-out infinite}@keyframes dotp{50%{transform:scale(1.7);opacity:.45}}
.gic{transition:transform .4s var(--spring),background .3s,box-shadow .4s}
.gi:hover .gic{background:color-mix(in srgb,var(--rose) 26%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--rose) 40%,transparent),0 0 3cqw color-mix(in srgb,var(--rose) 30%,transparent)}
.gi:active .gic{transform:scale(.84)}
.wedge{transition:fill-opacity .5s var(--ease),filter .5s var(--ease)}.wedge.sel{filter:drop-shadow(0 0 5px var(--rose))}
.pill,.chip,.back,.row,.shh button{transition:transform .35s var(--spring),background .3s,color .3s,border-color .3s}
.pill:hover,.chip:hover{border-color:var(--rose);color:var(--ink)}.pill:active,.chip:active{transform:scale(.93)}
.row:active{transform:scale(.98);background:color-mix(in srgb,var(--rose) 8%,transparent)}.back:active{transform:translateX(-5px)}
.fp{transition:background .35s,transform .4s var(--spring)}
.fp::after{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid var(--rose);opacity:0;animation:ringOut 3.8s var(--ease) infinite;pointer-events:none}.fp.open::after{animation:none}
.fp svg{transition:transform .7s var(--spring)}.fp.open svg{transform:rotate(90deg) scale(1.12)}
@keyframes ringOut{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(1.9);opacity:0}}
.shp{transition:transform .7s var(--ease)}
.shbg{transition:opacity .45s var(--ease),backdrop-filter .6s var(--ease)}.sheet.in .shbg{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet.in:not(.still) .row,.sheet.in:not(.still) .fi{animation:rowIn .65s var(--ease) calc(var(--n,0)*45ms + 200ms) backwards}
@keyframes rowIn{from{opacity:0;transform:translateY(16px)}}
.toast{transform:translate(-50%,14px) scale(.9);filter:blur(6px);transition:opacity .4s var(--ease),transform .55s var(--spring),filter .4s}
.toast.show{transform:translate(-50%,0) scale(1);filter:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#app>*{animation:riseIn .85s var(--ease) calc(var(--j,0)*75ms + 300ms) backwards}
#app>:nth-child(2){--j:1}#app>:nth-child(3){--j:2}#app>:nth-child(4){--j:3}
.app-ico{position:relative}.app-ico::before{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid var(--rose);animation:ringOut 3.2s var(--ease) infinite;pointer-events:none}
#appG>*{stroke-dasharray:1;animation:draw 1.2s var(--ease) .5s backwards}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.dial{animation:burn 70s ease-in-out infinite alternate}@keyframes burn{from{transform:translate(-5px,-4px)}to{transform:translate(5px,4px)}}
.aod-time b{animation:breathe 6s ease-in-out infinite}@keyframes breathe{50%{opacity:.8}}

.rip{position:absolute;width:24cqw;height:24cqw;margin:-12cqw 0 0 -12cqw;border-radius:50%;border:1px solid var(--rose);background:radial-gradient(circle,color-mix(in srgb,var(--rose) 22%,transparent),transparent 65%);pointer-events:none;z-index:7;animation:rip .85s var(--ease) forwards}
@keyframes rip{from{transform:scale(.2);opacity:.9}to{transform:scale(1.5);opacity:0}}
.sheet.ct .shp{transform:none;clip-path:circle(0 at var(--cx,50%) var(--cy,-40%));transition:clip-path .75s var(--inout)}

/* ---- merged: wallpaper, soft UI, obsidian home ---- */
.wp{position:absolute;inset:0;width:100%;height:100%;opacity:var(--wpo,.55);transition:opacity .8s var(--ease);pointer-events:none}
